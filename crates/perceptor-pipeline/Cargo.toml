[package]
name = "perceptor-pipeline"
description = "ECS pipeline, stages and plugins for the perceptor computer vision library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["metrics"]
# `PipelineMetrics` e spans por stage: um marcador por fronteira entre stages
metrics = []
# Um span por sistema, emitido pelo próprio `bevy_ecs`
trace-systems = ["bevy_ecs/trace"]

[dependencies]
perceptor-core = { workspace = true, features = ["image"] }
perceptor-imgproc.workspace = true
bevy_ecs.workspace = true
image.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
