[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Bappoz/perceptor"
# Piso imposto pelas dependências (bevy_ecs 0.20 exige 1.95)
rust-version = "1.95"

[workspace.dependencies]
perceptor-core = { path = "crates/perceptor-core", version = "0.1.0" }
perceptor-imgproc = { path = "crates/perceptor-imgproc", version = "0.1.0" }
# Features repassadas pela fachada, por isso sem as padrão aqui
perceptor-pipeline = { path = "crates/perceptor-pipeline", version = "0.1.0", default-features = false }
# Só para testes; `publish = false`, por isso sem `version`
perceptor-testkit = { path = "crates/perceptor-testkit" }

# ECS engine — orquestração do pipeline
bevy_ecs = "0.20"
# Tensores e processamento numérico
ndarray = { version = "0.17", features = ["rayon"] }
# I/O de imagens
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
# Paralelismo data-parallel
rayon = "1.12"
# Casts verificados entre fatias de pixels e de subpixels (sem unsafe próprio)
bytemuck = { version = "1.25", features = ["derive"] }
# Tratamento de erros
anyhow = "1.0"
thiserror = "2.0"
# Logging/tracing estruturado
tracing = "0.1"
# Tratador de Ctrl-C/SIGINT portável (a std não expõe sinais)
ctrlc = "3.5"
# Testes de propriedade
proptest = "1.11"
# Diretórios temporários em testes
tempfile = "3"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[package]
name = "perceptor"
description = "Modular computer vision pipeline library built on ECS"
keywords = ["computer-vision", "ecs", "image-processing", "pipeline"]
categories = ["multimedia::images", "science"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
perceptor-core.workspace = true
perceptor-imgproc.workspace = true
perceptor-pipeline.workspace = true

[dev-dependencies]
anyhow.workspace = true
# `#[derive(Component)]` nos exemplos expande para caminhos `bevy_ecs::`
bevy_ecs.workspace = true
image.workspace = true
# `rayon::prelude` nos exemplos de iteração paralela
rayon.workspace = true
tempfile.workspace = true

[features]
default = ["metrics"]
# `PipelineMetrics` e spans de tracing por stage
metrics = ["perceptor-pipeline/metrics"]
# Um span de tracing por sistema (feature `trace` do `bevy_ecs`)
trace-systems = ["perceptor-pipeline/trace-systems"]
# `PipelineBuilder::stop_on_ctrl_c`
ctrlc = ["perceptor-pipeline/ctrlc"]
ml  = []                # Marcador para habilitar plugins ML (tch-rs / ort)

[[example]]
name = "metrics"
required-features = ["metrics"]

[lints]
workspace = true
